<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Desktop Cat</title>
<link rel="stylesheet" href="card.css">
<link rel="stylesheet" href="settings.css">
<link rel="stylesheet" href="market.css">
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:transparent;user-select:none;-webkit-user-select:none}
  #stage{position:fixed;inset:0;display:block;touch-action:none}
  body.demo{background:linear-gradient(#f4efe6 0 78%,#d9c7a8 78% 100%)}
  @media (prefers-color-scheme: dark){ body.demo{background:linear-gradient(#1e1a16 0 78%,#3a2f24 78% 100%)} }
  .gamebox{position:fixed;left:50%;top:80px;transform:translateX(-50%);z-index:50;min-width:280px;padding:16px 20px;border-radius:18px;background:#fff7ec;color:#5b3a29;
    font:700 15px "Nunito",sans-serif;text-align:center;box-shadow:0 0 0 3px #5b3a29,0 6px 0 3px #5b3a29}
  .gamebox[hidden]{display:none}
  .gamebox b{font:700 20px "Pixelify Sans",monospace}
  .gamebox p{margin:8px 0}
  .gamebox small{display:block;opacity:.7;margin-bottom:6px}
  .gamebox div{display:flex;gap:8px;justify-content:center;margin-top:8px}
  .gamebox button{font:800 13px "Nunito",sans-serif;padding:7px 14px;border:0;border-radius:99px;background:#ffd34d;color:#5b3a29;cursor:pointer;box-shadow:0 0 0 2px #5b3a29,0 3px 0 2px #5b3a29}
</style>
</head>
<body>
<canvas id="stage"></canvas>
<script src="cat.js"></script>
<script src="profile.js"></script>
<script src="card.js"></script>
<script src="settings.js"></script>
<script src="market.js"></script>
<script src="weather.js"></script>
<script src="games.js"></script>
<script src="guests.js"></script>
<script>
(() => {
  const { World, COATS, COAT_KEYS, SCALE_MIN, SCALE_MAX } = window.DesktopCat;
  const L = window.CatLife;
  const bridge = window.deskcat;                 // present only inside the Electron app
  const KEY = "desktop-cat:v2", OLD_KEY = "desktop-cat:v1";
  const read = (k) => { try { return JSON.parse(localStorage.getItem(k)) || null; } catch { return null; } };


  // your own meow recordings live in IndexedDB (they're too big for localStorage), in three groups by age
  const Voices = (() => {
    const db = new Promise((ok) => {
      try { const r = indexedDB.open("desktop-cat", 1); r.onupgradeneeded = () => r.result.createObjectStore("voices"); r.onsuccess = () => ok(r.result); r.onerror = () => ok(null); } catch { ok(null); }
    });
    const cache = { kitten: [], adult: [], elder: [], purr: [] };
    const tx = async (mode, fn) => { const d = await db; if (!d) return null; return new Promise((ok) => { const t = d.transaction("voices", mode), st = t.objectStore("voices"), r = fn(st); t.oncomplete = () => ok(r && r.result); t.onerror = () => ok(null); }); };
    const push = (g) => world && world.setVoices(g, cache[g]);
    return {
      async load() { for (const g of Object.keys(cache)) { const v = await tx("readonly", (st) => st.get(g)); cache[g] = Array.isArray(v) ? v : []; if (cache[g].length) await push(g); } },
      async add(g, files) {
        for (const f of files.slice(0, 12)) if (f.size < 3e6) cache[g].push(await f.arrayBuffer());
        cache[g] = cache[g].slice(-12); await tx("readwrite", (st) => st.put(cache[g], g)); await push(g);
      },
      async clear(g) { cache[g] = []; await tx("readwrite", (st) => st.put([], g)); await push(g); },
      counts() { return { kitten: cache.kitten.length, adult: cache.adult.length, elder: cache.elder.length, purr: cache.purr.length }; },
    };
  })();

  if (!bridge) document.body.classList.add("demo");

  // saved cats are full profiles; an older save (just a list of coats) is brought over as grown-up cats
  let saved = read(KEY);
  if (!saved) {
    const old = read(OLD_KEY) || { cats: ["ginger"], scale: 3 };
    saved = { cats: L.migrate(old.cats || []), scale: old.scale || 3, toyScale: old.toyScale || old.scale || 3 };
  }
  if (saved.lang) L.lang = saved.lang;
  L.tasksOn = true; L.breedOn = saved.breedOn ?? true;
  if (saved.pantry) Object.assign(L.pantry, saved.pantry);
  if (saved.econ) L.econ = { ...L.econ, ...saved.econ };
  if (saved.luck) L.luck = { ...L.luck, ...saved.luck };
  if (saved.guests) L.guests = saved.guests;
  // toys: what you own and how worn it is (an older save gets its free yarn back once)
  if (Array.isArray(saved.toys)) L.toys = saved.toyCond ? saved.toys.slice() : saved.toys.includes("yarn") ? saved.toys : ["yarn", ...saved.toys];
  if (saved.toyCond) L.toyCond = { ...saved.toyCond };
  L.loadWallet(saved.wallet, saved.cats);
  // furniture: every piece you own, with its condition and where it stands (older saves kept counts per kind)
  const newId = () => Math.random().toString(36).slice(2, 9);
  if (saved.home && Array.isArray(saved.home.items)) L.home.items = saved.home.items.filter((i) => DesktopCat.FURN[i.k]);
  else if (saved.home) {
    const ow = saved.home.owned, pl = saved.home.placed;
    const owned = Array.isArray(ow) ? Object.fromEntries(ow.map((k) => [k, 1])) : ow || {};
    const placed = Array.isArray(pl) ? pl.slice() : Object.entries(pl || {}).map(([k, x]) => ({ k, x }));
    for (const [k, n] of Object.entries(owned)) for (let i = 0; i < n; i++) {
      const at = placed.findIndex((p) => p.k === k); const x = at >= 0 ? placed.splice(at, 1)[0].x : null;
      if (DesktopCat.FURN[k]) L.home.items.push({ id: newId(), k, cond: 100, x });
    }
  }
  if (saved.game) L.game = { best: 0, day: "", stars: 0, ...saved.game };
  // "days together" count from your very first cat
  L.since = saved.since || Math.min(Date.now(), ...saved.cats.map((p) => p.born || Date.now())); L.togetherDone = saved.togetherDone || 0;
  // how long you were away, and whether this is the first visit of the day
  const lastSeen = Math.max(0, ...saved.cats.map((p) => p.seen || 0)), awayH = lastSeen ? (Date.now() - lastSeen) / 3.6e6 : 0;
  const dayKey = new Date().toDateString(), firstToday = saved.lastDay && saved.lastDay !== dayKey;
  saved.cats.forEach(L.welcomeBack);

  let world, cardPos = saved.cardPos || null, weatherOn = saved.weatherOn ?? true, weatherLoc = saved.weatherLoc || null, weatherCache = saved.weatherCache || null;
  const save = () => {
    try {
      localStorage.setItem(KEY, JSON.stringify({ cats: world.cats.filter((c) => c.profile).map((c) => c.profile), scale: world.scale, toyScale: world.toyScale,
        lang: L.lang, cardSize: card ? card.size : saved.cardSize, cardPos, purrOn: world.purrOn, meowOn: world.meowOn, nightMode: world.nightMode,
        tasksOn: L.tasksOn, breedOn: L.breedOn, wallet: L.wallet, game: L.game, birdsOn: world.birdsOn, strayOn: world.strayOn, pantry: L.pantry, econ: L.econ, luck: L.luck, weatherOn, weatherLoc, weatherCache, toys: L.toys, toyCond: L.toyCond, guests: L.guests,
        home: { items: L.home.items.map((it) => { const f = world.furniture.find((f) => f.item === it); return { ...it, cond: +it.cond.toFixed(2), x: f ? +(f.x / world.W).toFixed(4) : null }; }) }, since: L.since, togetherDone: L.togetherDone, lastDay: dayKey, seasonsOn: world.seasonsOn }));
    } catch {}
  };
  let saveT = 0; L.onChange = () => { clearTimeout(saveT); saveT = setTimeout(save, 400); card && card.refresh(); };
  setInterval(save, 10000); addEventListener("beforeunload", save);

  // the window only catches the mouse over a cat, a toy or the card; everywhere else clicks go to the desktop
  let hovering = false, overCat = false, overUI = false;
  const syncIgnore = () => { const h = overCat || overUI; if (bridge && h !== hovering) { hovering = h; bridge.setIgnore(!h); } };
  world = new World(document.getElementById("stage"), {
    scale: saved.scale, toyScale: saved.toyScale || saved.scale, purrOn: saved.purrOn ?? saved.sound ?? true, meowOn: saved.meowOn ?? saved.sound ?? true, nightMode: saved.nightMode || "auto", seasonsOn: saved.seasonsOn ?? true, birdsOn: saved.birdsOn ?? true, strayOn: saved.strayOn ?? true, floorInset: bridge ? 2 : Math.round(innerHeight * 0.22) - 40,
    onHover: (h) => { overCat = h; syncIgnore(); }
  });
  addEventListener("pointermove", (e) => { overUI = !!(e.target.closest && e.target.closest(".ui")); syncIgnore(); }, true);
  if (!bridge) addEventListener("resize", () => { world.floorInset = Math.round(innerHeight * 0.22) - 40; world.resize(); });
  saved.cats.forEach((p, i) => setTimeout(() => { world.addCat(null, p); }, 350 * i));
  Voices.load();
  // furniture back where you left it
  L.home.items.forEach((it) => { if (it.x != null) world.placeFurniture(it.k, it.x * world.W, it); });
  // the market: food and furniture for coins
  var market = window.CatMarket.create({
    openInventory: (msg) => { market.close(); games.close(); settings.close(); inventory.open("mine", msg); },
    openMarket: (tab) => { inventory.close(); market.open(tab); },
    world,
    placeItem: (it) => { if (!world.furniture.some((f) => f.item === it)) { const f = world.placeFurniture(it.k, undefined, it); it.x = f.x / world.W; world.confetti(f.x, world.floor - 30, 16); } save(); },
    // using something from the cupboard
    useFood: (k) => {
      if (k === "catnip") return act.catnip();
      if (k === "medicine" || k === "shampoo") {
        const c = card.isOpen && card.cat && card.cat.profile ? card.cat : null;
        if (!c) return inventory.open("mine", L.lang === "tr" ? "Önce bir kedinin kartını aç 🐱" : "Open a cat's card first 🐱");
        if (k === "medicine") { if (!c.profile.sick) return; L.pantry.medicine--; L.cure(c); }
        else { L.pantry.shampoo--; c.profile.clean = 100; L.addLove(c, -6); L.write(c.profile, "bath"); c.set("arch", 1.4); }
        L.changed(); card.refresh(); return;
      }
      if (k === "litter") return cleanLitter(world.furniture.filter((f) => f.kind === "litter").sort((a, b) => (b.item.dirty || 0) - (a.item.dirty || 0))[0]);
      preferMeal = k; world.feed(); preferMeal = null;
    },
    storeItem: (it) => { const f = world.furniture.find((f) => f.item === it); if (f) world.removeFurniture(f); it.x = null; save(); },
    // the cat tab: adopt a kitten of an unlocked coat; the toy tab: take a toy out (or switch the laser / wand)
    adopt: (coat) => { market.close(); act.add(coat); },
    catCount: () => world.cats.filter((c) => c.profile).length,
    catCountOf: (coat) => world.cats.filter((c) => c.profile && c.coat === coat).length,
    playToy: (k) => { if (act[k]) act[k](); },
    toyOn: (k) => act.toyOut(k),
    storeToy: (k) => act.storeToy(k),
    clearToys: () => act.clear(),
    onClose: () => { overUI = false; syncIgnore(); },
  });
  // meals come out of the cupboard; when it's empty, the market opens on the food shelf
  let preferMeal = null;
  // the automatic feeder: when the bowl is empty and someone's hungry, it fills it from the cupboard (once every 8 hours)
  setInterval(() => {
    const f = world.furniture.find((f) => f.kind === "feeder" && f.usable); if (!f) return;
    if (Date.now() - (f.item.fedAt || 0) < 8 * 3.6e6) return;
    if (world.bowl && world.bowl.food > 0.05) return;
    if (!world.cats.some((c) => c.profile && L.isHungry(c.profile))) return;
    const k = L.takeMeal(null); if (!k) return; L.pantry[k]++;     // just checking there's a meal; feed() takes it
    f.item.fedAt = Date.now(); world.feed(); world.burst(f.x, world.floor - 30 * world.toyScale, "note", "#4be07a", 2); save();
  }, 60e3);
  world.onFeed = () => { const k = L.takeMeal(preferMeal); if (!k) { market.open("food", market.t().empty); return null; } save(); return k; };
  // cleaning the litter box takes a scoop of litter from the cupboard
  function cleanLitter(f) {
    if (!f) return;
    if ((L.pantry.litter || 0) <= 0) return market.open("food", L.lang === "tr" ? "Kedi kumu bitti! Buradan alabilirsin 🪣" : "Out of litter! You can buy some here 🪣");
    L.pantry.litter--; f.item.dirty = 0; world.burst(f.x, world.floor - 14 * world.toyScale, "spark", "#bff0dd", 6); L.changed(); save();
  }
  world.onCleanLitter = cleanLitter;
  // a little "+🪙" where the coins came from
  L.onEarn = (n, at) => {
    const el = document.createElement("div"); el.className = "ui coinpop"; el.textContent = `+${n}🪙`;
    const x = at && at.x != null ? at.x : innerWidth - 80, y = at && at.y != null ? at.y - 50 * (at.s || 3) : world.floor - 60;
    el.style.left = `${x}px`; el.style.top = `${y}px`; document.body.appendChild(el); setTimeout(() => el.remove(), 1300);
  };
  // using your computer pays a tiny bit: 1 coin for every 15 active minutes, at most 20 a day
  setInterval(() => {
    if (world.idleFor() > 120 || document.hidden) return;
    const E = L.econToday(); E.min = (E.min || 0) + 1;
    if (E.min % 15 === 0 && E.pc < 20) { E.pc++; L.earn(1); }
  }, 60000);
  // a lonely cat that walked out: the others remember
  world.onCatLeft = (c) => {
    if (c.profile && c.profile.guest) { if (card.cat === c) card.close(); save(); card.refresh(); return; }     // a guest going home
    world.cats.forEach((o) => { if (o.profile) L.write(o.profile, "left", { n: c.profile.name }); });
    if (card.cat === c) card.close(); save(); card.refresh();
  };
  // a stray who's been fed three times moves in
  world.onAdoptStray = (c) => {
    const p = L.make(c.coat, { taken: world.cats.filter((x) => x.profile).map((x) => x.profile.name), g0: 0.6, love: 55, quiet: true });
    p.log = []; L.write(p, "strayIn"); L.remember(p, "strayIn");
    c.profile = p; c.mods = L.mods(p); c.size = L.size(p); save();
    setTimeout(() => card.open(c, { naming: true }), 900);
  };
  // the laser game: stars for a good score (up to six a day from the game), and a record to beat
  const gameBox = document.createElement("div"); gameBox.className = "ui gamebox"; gameBox.hidden = true; document.body.appendChild(gameBox);
  world.onGameEnd = (score) => {
    const t = L.STR[L.lang], E = L.econToday();
    const best = score > (L.game.best || 0); if (best) L.game.best = score;
    // 1 coin for every two stars caught (25 a day at most), and a star for a score of 20+ (once a day)
    const coins = Math.max(0, Math.min(Math.floor(score / 2), 25 - E.game)); E.game += coins; if (coins) L.earn(coins);
    const st = score >= 20 && !E.gameStars ? 1 : 0; if (st) { E.gameStars = 1; L.wallet.stars += st; }
    const capped = (score > 0 && !coins) || (score >= 20 && !st);
    gameBox.innerHTML = `<b>🔴 ${t.game}</b><p>${t.gameOver(score, st, best)}${coins ? ` +${coins}🪙` : ""}</p>${capped ? `<small>${t.gameCap}</small>` : ""}<small>${t.bestL(L.game.best)}</small><div><button data-g="again">${t.again}</button><button data-g="close">${t.closeB}</button></div>`;
    gameBox.hidden = false; if (st) world.confetti(innerWidth / 2, 120, 40); L.changed(); save();
  };
  gameBox.addEventListener("click", (e) => { const b = e.target.closest("[data-g]"); if (!b) return; gameBox.hidden = true; if (b.dataset.g === "again") act.game(); overUI = false; syncIgnore(); });

  var card = window.CatCard.create(world, {
    size: saved.cardSize,
    onAdopt: () => { settings.close(); games.close(); market.open("cats"); },
    onLang: () => { applyLang(); save(); },
    onSize: () => save(),
    pos: cardPos,
    onPos: (p) => { cardPos = p; save(); },
    onSound: () => act.mute(),
    sound: () => world.purrOn || world.meowOn,
    voices: Voices,
    onNeed: (k, msg) => market.open(k === "brush" ? "toys" : "food", msg || (L.lang === "tr" ? "Bu marketten alınır 🛒" : "Get this in the market 🛒")),
    onMarket: () => only(market),
    onInventory: () => only(inventory),
    onSettings: () => only(settings),
    onGames: () => only(games),
    onRemove: (c) => { world.removeCat(c); save(); card.refresh(); },
    onClose: () => { overUI = false; syncIgnore(); },
  });

  // birthdays and "days together": checked a few seconds after the cats arrive, then every minute
  const checkBirthdays = () => {
    world.cats.forEach((c) => { if (c.profile && L.birthdayDue(c.profile)) world.celebrate(c); });
    const n = L.togetherDue();
    if (n) world.cats.forEach((c, i) => { if (!c.profile) return; L.write(c.profile, "together", { n }); L.remember(c.profile, "together", { n }); setTimeout(() => world.celebrate(c), i * 600); });
    if (n) L.changed();
  };
  // coming back after a while: the cats come to say hello (and good morning, the first time each day)
  setTimeout(() => {
    if (awayH >= 3) world.greet(awayH >= 12);
    else if (firstToday && new Date().getHours() < 13) world.greet(false, "morning");
  }, 350 * saved.cats.length + 1800);
  setTimeout(checkBirthdays, 350 * saved.cats.length + 2500); setInterval(checkBirthdays, 60000);

  // kittens: two happy grown-up friends sometimes have one (checked every minute, if switched on)
  function haveKitten(force) {
    const r = L.tryBreed(world, force); if (!r) return null;
    const [a, b] = r.parents, s = world.scale;
    const kits = r.kits.map((p, i) => { const k = world.addCat(null, p); k.x = (a.x + b.x) / 2 + (i - (r.kits.length - 1) / 2) * 24 * s; k.y = world.floor - (40 + i * 10) * s; return k; }), c = kits[0];
    [a, b].forEach((p) => { world.burst(p.x, p.y - 32 * p.s, "heart", "#e2557a", 4); if (!["held", "fall", "leap", "inbox", "sleep"].includes(p.state) && !p.bed && !p.perch) p.set("happy", 3, { eyes: null }); });
    world.confetti(c.x, world.floor - 30 * s, 28); world.meow(c); save();
    return kits;
  }
  setInterval(() => haveKitten(false), 60000);
  window.DesktopCatDemo = { haveKitten };

  // keep the settings panel (and the few tray items) in step
  function syncToggles() {
    if (bridge) bridge.setSettings({ lang: L.lang });
    if (settings) settings.sync();
  }
  // one language for everything: the settings, the cards and the tray
  function applyLang() { document.documentElement.lang = L.lang; syncToggles(); }
  // toys are bought in the market (only the yarn comes free); a locked one opens the toy shelf instead
  const need = (k, fn) => { if (L.hasToy(k)) return fn(); market.open("toys", L.lang === "tr" ? "Bu oyuncak önce marketten alınmalı 🧸" : "Buy this toy in the market first 🧸"); };
  const act = {
    // a new cat always arrives as a kitten, and asks for a name
    add: (coat) => {
      // only the ginger tabby is free; other coats are unlocked with stars in the market's cat tab
      if (coat && COATS[coat] && !L.hasCoat(coat)) return market.open("cats");
      if (!coat || !COATS[coat]) { const ok = COAT_KEYS.filter(L.hasCoat); coat = ok[Math.floor(Math.random() * ok.length)]; }
      if (world.cats.filter((c) => c.profile).length >= (L.MAX_CATS || 8)) return;
      const p = L.make(coat, { taken: world.cats.map((c) => c.profile && c.profile.name) });
      const c = world.addCat(null, p); save();
      setTimeout(() => card.open(c, { naming: true }), 700);
    },
    remove: () => { world.removeCat(card.isOpen ? card.cat : undefined); save(); card.refresh(); },
    removeAll: () => { world.removeAllCats(); save(); card.close(); },
    shelf: () => need("shelf", () => world.addShelf()),
    purr: (on) => { world.purrOn = typeof on === "boolean" ? on : !world.purrOn; save(); syncToggles(); if (world.purrOn) world.purr(); },
    meow: (on) => { world.meowOn = typeof on === "boolean" ? on : !world.meowOn; save(); syncToggles(); if (world.meowOn) world.meow(world.cats[0]); },
    // the card's 🔊 button: everything off, or everything back on
    mute: () => { const any = world.purrOn || world.meowOn; world.purrOn = world.meowOn = !any; save(); syncToggles(); card.refresh(); },
    birds: (on) => { world.birdsOn = typeof on === "boolean" ? on : !world.birdsOn; save(); syncToggles(); },
    strays: (on) => { world.strayOn = typeof on === "boolean" ? on : !world.strayOn; save(); syncToggles(); },
    bird: () => world.addBird({ land: Math.random() < 0.6 }),
    stray: () => world.addStray(),
    game: () => games.open("laser"),
    games: () => games.open(),
    playGame: () => { gameBox.hidden = true; card.close(); world.startGame(); const c = world.cats[0]; if (c) world.meow(c); },
    seasons: (on) => { world.seasonsOn = typeof on === "boolean" ? on : !world.seasonsOn; save(); syncToggles(); },
    breed: (on) => { L.breedOn = typeof on === "boolean" ? on : !L.breedOn; save(); syncToggles(); card.refresh(); },
    lang: (l) => { L.lang = l === "tr" || l === "en" ? l : L.lang === "tr" ? "en" : "tr"; applyLang(); card.refresh(); save(); },
    night: (mode) => { const order = ["auto", "night", "day"]; world.nightMode = order.includes(mode) ? mode : order[(order.indexOf(world.nightMode) + 1) % 3]; save(); syncToggles(); },
    cards: () => { const c = card.cat && world.cats.includes(card.cat) ? card.cat : world.cats.find((c) => c.profile); if (c) card.open(c); else act.add(); },
    yarn: () => need("yarn", () => world.throwYarn()),
    // putting a toy back in the inventory (it stops wearing out while it's put away)
    storeToy: (k) => {
      if (k === "yarn") world.yarn = null;
      else if (k === "mouse") world.mouse = null;
      else if (k === "butterfly") world.butterfly = null;
      else if (k === "box") { world.boxes.forEach((b) => { if (b.occupant) b.occupant.hopOut(); }); world.boxes = []; }
      else if (k === "post") { if (world.post && world.post.user) world.post.user.set("sit", 2); world.post = null; }
      else if (k === "shelf") world.shelves = world.shelves.filter((s) => s.isPlatform);
      else if (k === "laser") world.setLaser(false);
      else if (k === "wand") world.setWand(false);
      syncToggles();
    },
    toyOut: (k) => ({ yarn: !!world.yarn, mouse: !!world.mouse, butterfly: !!world.butterfly, box: world.boxes.length > 0, post: !!world.post, shelf: world.shelves.some((s) => !s.isPlatform), laser: !!world.laser, wand: !!world.wand })[k] || false,
    mouse: () => need("mouse", () => world.addMouse()),
    box: () => need("box", () => world.addBox()),
    feed: () => world.feed(),
    laser: (on) => need("laser", () => { world.setLaser(typeof on === "boolean" ? on : undefined); syncToggles(); }),
    wand: (on) => need("wand", () => { world.setWand(typeof on === "boolean" ? on : undefined); syncToggles(); }),
    catnip: () => { if ((L.pantry.catnip || 0) > 0) { L.pantry.catnip--; world.dropCatnip(); L.changed(); } else market.open("food", market.t().empty); },
    market: (tab) => market.open(tab),
    adopt: () => market.open("cats"),
    butterfly: () => need("butterfly", () => world.addButterfly()),
    bed: () => world.addBed(),
    post: () => need("post", () => world.addPost()),
    clear: () => { world.clearToys(); syncToggles(); },
    // the size sliders: cats, toys
    setScale: (k, v) => { world[k] = Math.max(SCALE_MIN, Math.min(SCALE_MAX, +v)); save(); },
    settings: () => settings.open(),
    bigger: () => { world.scale = Math.min(SCALE_MAX, world.scale + 1); save(); },
    smaller: () => { world.scale = Math.max(SCALE_MIN, world.scale - 1); save(); },
    toysBigger: () => { world.toyScale = Math.min(SCALE_MAX, world.toyScale + 1); save(); },
    toysSmaller: () => { world.toyScale = Math.max(SCALE_MIN, world.toyScale - 1); save(); },
  };

  // right-click a cat to open its card, right above it
  const catAt = (e) => { const h = world.hitTest(e.clientX, e.clientY); return h && h.cat; };
  addEventListener("contextmenu", (e) => { const c = catAt(e); if (c) { e.preventDefault(); card.open(c); } });
  addEventListener("dblclick", (e) => {
    if (e.target.closest && e.target.closest(".ui")) return;
    if (catAt(e)) return;
    if (!bridge && L.hasToy("yarn") && !world.hitTest(e.clientX, e.clientY)) world.throwYarn(e.clientX, e.clientY);
  });

  // 🎮 mini games
  // 🎒 the inventory: the cupboard and your things, in a panel of its own (same wiring as the market)
  var inventory = window.CatMarket.create({ ...market.opts, only: "mine" });
  // one panel beside the card at a time: tapping its button again closes it
  function only(p) { const open = p.isOpen; [market, inventory, settings, games].forEach((x) => x.close()); if (!open) p.open(); }
  // the open panel's button stays lit on the card
  setInterval(() => document.querySelectorAll(".cc-top .cc-tab.tool").forEach((b, i) => b.classList.toggle("on", !![games, market, inventory, settings][i] && [games, market, inventory, settings][i].isOpen)), 300);
  // 🧳 guest cats from the neighbours
  var guests = window.CatGuests.create({ world, save: () => save() }); window.CatGuests.now = guests;
  var games = window.CatGames.create({ world, playLaser: () => act.playGame(), onClose: () => { overUI = false; syncIgnore(); } });
  // the real weather outside: rain, snow, storms, fog, clouds (refreshed every 20 minutes)
  const weather = window.CatWeather.create({
    world, isOn: () => weatherOn, getLoc: () => weatherLoc, setLoc: (l) => { weatherLoc = l; save(); },
    getCache: () => weatherCache, setCache: (c) => { weatherCache = c; save(); },
    onUpdate: () => settings && settings.sync(),
  });
  weather.refresh();
  var settings = window.CatSettings.create({
    world, act, bridge, card: () => card,
    weather: {
      isOn: () => weatherOn, now: () => weather.now, icon: (k) => weather.ICON[k] || "",
      toggle: (on) => { weatherOn = on; if (!on) { world.weather = null; world.seasonOverride = null; } save(); weather.refresh(); },
      setCity: async (name) => { try { const l = await weather.findCity(name, L.lang); if (!l) return false; weatherLoc = l; save(); await weather.refresh(true); return true; } catch { return false; } },
      auto: async () => { weatherLoc = null; save(); await weather.refresh(true); },
    },
    setCardSize: (v) => { card.setSize(v); save(); },
    onClose: () => { overUI = false; syncIgnore(); },
  });
  if (bridge) bridge.onCommand((cmd) => { if (act[cmd.type]) act[cmd.type](cmd.on ?? cmd.mode ?? cmd.lang ?? cmd.coat); });
  applyLang();
  if (!bridge) setTimeout(() => { if (!world.yarn && L.hasToy("yarn")) world.throwYarn(); }, 2500);
  // toys left out wear a little every day (3 points), and a toy worn to nothing is gone
  setInterval(() => { for (const k of L.toys.slice()) if (act.toyOut(k)) L.wearToy(k, 3 / 1440); save(); }, 60e3);
  L.onToyBroke = (k) => {
    act.storeToy(k);
    const nm = market.t().toys[k] ? market.t().toys[k][0] : k, e = market.t().toyE[k] || "🧸";
    toast(L.lang === "tr" ? `${e} ${nm} eskiyip parçalandı! Marketten yenisini alabilirsin.` : `${e} The ${nm.toLowerCase()} wore out! You can buy a new one in the market.`);
    world.burst(world.W / 2, world.floor - 40, "dust", "rgba(140,120,100,.6)", 6); inventory.render(); market.render();
  };
  // a little note above the floor for things that just happened
  const toastBox = document.createElement("div"); toastBox.className = "ui gs-box"; toastBox.hidden = true; document.body.appendChild(toastBox);
  let toastT = 0;
  function toast(msg) { toastBox.innerHTML = `<p></p>`; toastBox.querySelector("p").textContent = msg; toastBox.style.bottom = `${Math.max(12, innerHeight - world.floor + 70)}px`; toastBox.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { toastBox.hidden = true; }, 7000); }
  toastBox.onclick = () => { toastBox.hidden = true; };
})();
</script>
</body>
</html>
